name: Package ARM64 runtime

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR tag to publish
        required: true
        default: vllm027-sm121
        type: string
      push_image:
        description: Push the image to GHCR
        required: true
        default: true
        type: boolean
      prepare_only:
        description: Stop after the standard cloud ARM runner uploads the build context
        required: true
        default: false
        type: boolean
      vllm_ref:
        description: Commit from cyijun/vllm
        required: true
        default: 2db20513ab9d73e61aecabb3ab83e8f60644718e
        type: string
      flashinfer_ref:
        description: Commit from cyijun/flashinfer
        required: true
        default: 6398edbbc6796d81781bd54827be860b65d8f38b
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    env:
      VLLM_REF: ${{ inputs.vllm_ref || '2db20513ab9d73e61aecabb3ab83e8f60644718e' }}
      FLASHINFER_REF: ${{ inputs.flashinfer_ref || '6398edbbc6796d81781bd54827be860b65d8f38b' }}

    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v7
        with:
          path: deployment

      - name: Check out linked vLLM fork
        uses: actions/checkout@v7
        with:
          repository: cyijun/vllm
          ref: ${{ env.VLLM_REF }}
          path: sources/vllm

      - name: Check out linked FlashInfer fork
        uses: actions/checkout@v7
        with:
          repository: cyijun/flashinfer
          ref: ${{ env.FLASHINFER_REF }}
          path: sources/flashinfer

      - name: Prepare deterministic build context
        shell: bash
        run: |
          context="$(mktemp -d "$RUNNER_TEMP/dsv4-context.XXXXXX")"
          deployment/scripts/prepare-build-context.sh \
            sources/vllm sources/flashinfer "$context"
          mkdir -p deployment/build-context
          cp -a "$context/." deployment/build-context/

      - name: Upload ARM64 build context
        uses: actions/upload-artifact@v7
        with:
          name: arm64-build-context
          path: deployment/build-context/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.prepare_only }}
    # The standard cloud ARM runner has only 14 GB of disk, less than the
    # 20.6 GB base image. Default to a trusted Spark runner; an organization
    # can set ARM64_BUILD_RUNNER to its GitHub-hosted larger-runner label.
    runs-on: ${{ vars.ARM64_BUILD_RUNNER || 'dgx-spark' }}
    environment: container-release
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      VLLM_REF: ${{ inputs.vllm_ref || '2db20513ab9d73e61aecabb3ab83e8f60644718e' }}
      FLASHINFER_REF: ${{ inputs.flashinfer_ref || '6398edbbc6796d81781bd54827be860b65d8f38b' }}
      BASE_IMAGE: vllm/vllm-openai:v0.27.1@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
      B12X_VERSION: 1.2.4
      B12X_SOURCE_IMAGE: ghcr.io/anemll/dspark-vllm-gx10:0.1.1

    steps:
      - name: Download cloud-prepared ARM64 build context
        uses: actions/download-artifact@v8
        with:
          name: arm64-build-context
          path: build-context

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.push_image
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag || 'vllm027-sm121' }}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and optionally push ARM64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: build-context
          file: build-context/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
          load: ${{ github.event_name == 'workflow_dispatch' && !inputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            B12X_VERSION=${{ env.B12X_VERSION }}
            B12X_SOURCE_IMAGE=${{ env.B12X_SOURCE_IMAGE }}
            VLLM_SOURCE_COMMIT=${{ env.VLLM_REF }}
            FLASHINFER_SOURCE_COMMIT=${{ env.FLASHINFER_REF }}
          provenance: mode=max

      - name: Attest pushed image
        if: github.event_name != 'workflow_dispatch' || inputs.push_image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
