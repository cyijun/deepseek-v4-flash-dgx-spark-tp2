name: Set GHCR package visibility

on:
  workflow_dispatch:
    inputs:
      visibility:
        description: GHCR package visibility
        required: true
        default: public
        type: choice
        options:
          - public
          - private

permissions:
  contents: read
  packages: write

jobs:
  update:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Update and verify package visibility
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: deepseek-v4-flash-dgx-spark-tp2
          REQUESTED_VISIBILITY: ${{ inputs.visibility }}
        run: |
          set -Eeuo pipefail
          visibility="$(gh api \
            --method PATCH \
            "/user/packages/container/$PACKAGE_NAME" \
            -f "visibility=$REQUESTED_VISIBILITY" \
            --jq .visibility)"
          test "$visibility" = "$REQUESTED_VISIBILITY"
          echo "GHCR package visibility: $visibility" >> "$GITHUB_STEP_SUMMARY"
